[package]
name = "workbuddy-proxy"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "A small native proxy for WorkBuddy, with bounded memory and streaming passthrough"
license = "MIT"
repository = "https://github.com/gloryhui/workbuddy-proxy"
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
rand = "0.9"
fs2 = "0.4"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "signal", "macros"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
