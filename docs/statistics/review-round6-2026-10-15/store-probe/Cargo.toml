[package]
name = "workbuddy-stats-store-review"
version = "0.0.0"
edition = "2024"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "signal", "macros"] }
