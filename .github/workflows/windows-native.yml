name: Frozen Windows native check
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/windows-screenshot-requirements.txt
      - name: Verify frozen artifacts and capture the native Windows UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows_frozen_native.py --output-dir bench-results/windows-frozen-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-frozen-native
          path: bench-results/windows-frozen-native/
