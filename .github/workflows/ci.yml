name: Core checks
on:
  push:
    branches: [main, codex/gpui-preview]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python scripts/smoke.py --exe target/release/workbuddy-proxy
      - run: python scripts/multi_routing.py --exe target/release/workbuddy-proxy
      - run: python scripts/multimodal_test.py --exe target/release/workbuddy-proxy
      - run: python scripts/model_discovery.py --exe target/release/workbuddy-proxy
      - run: python scripts/connection_test.py --exe target/release/workbuddy-proxy
      - run: python scripts/port_change.py --exe target/release/workbuddy-proxy
