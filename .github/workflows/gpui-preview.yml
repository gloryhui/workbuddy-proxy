name: GPUI preview packages (no Release)
on:
  push:
    branches: [codex/gpui-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            core: target/release/workbuddy-proxy.exe
            ui: gpui/target/release/workbuddy-proxy-gpui.exe
          - os: macos-latest
            platform: macos-arm64
            core: target/release/workbuddy-proxy
            ui: gpui/target/release/workbuddy-proxy-gpui
          - os: macos-15-intel
            platform: macos-x64
            core: target/release/workbuddy-proxy
            ui: gpui/target/release/workbuddy-proxy-gpui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            gpui -> target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo fmt --manifest-path gpui/Cargo.toml --check
      - run: cargo clippy --manifest-path gpui/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path gpui/Cargo.toml --locked
      - run: cargo build --manifest-path gpui/Cargo.toml --release --locked
      - name: Test core routing and model isolation
        run: python scripts/multi_routing.py --exe "${{ matrix.core }}"
      - name: Install DMG build-only tools
        if: runner.os == 'macOS'
        run: python -m pip install -r scripts/dmg-requirements.txt
      - name: Package both executables without publishing a Release
        run: python scripts/package.py --exe "${{ matrix.core }}" --gpui "${{ matrix.ui }}" --variant gpui-kit-preview.3 --platform "${{ matrix.platform }}"
      - name: Test extracted Windows package and measure open/closed memory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'workbuddy-gpui-package'
          Expand-Archive -Path 'dist/workbuddy-proxy-0.4.0-gpui-kit-preview.3-windows-x64.zip' -DestinationPath $packageRoot
          $packagedExe = (Get-ChildItem -Path $packageRoot -Filter 'workbuddy-proxy.exe' -Recurse).FullName
          python scripts/gpui_package_test.py --exe "$packagedExe" --output 'bench-results/gpui-windows-x64.json'
      - name: Test copied Mac DMG application and measure open/closed memory
        if: runner.os == 'macOS'
        run: python scripts/gpui_macos_package.py --dmg "dist/workbuddy-proxy-0.4.0-gpui-kit-preview.3-${{ matrix.platform }}.dmg" --output "bench-results/gpui-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbuddy-proxy-gpui-${{ matrix.platform }}
          path: |
            dist/
            bench-results/
